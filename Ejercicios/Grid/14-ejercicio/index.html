<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Pro con Grid</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <header>
        <h1>Galería Fotográfica</h1>
    </header>

    <section class="galeria">
        <figure class="item horizontal"><img src="https://picsum.photos/800/400?random=1" alt="Paisaje"></figure>
        <figure class="item vertical"><img src="https://picsum.photos/400/800?random=2" alt="Retrato"></figure>
        <figure class="item"><img src="https://picsum.photos/400/400?random=3" alt="Square"></figure>
        <figure class="item grande"><img src="https://picsum.photos/800/800?random=4" alt="Enfoque"></figure>
        <figure class="item"><img src="https://picsum.photos/400/400?random=5" alt="Square"></figure>
        <figure class="item horizontal"><img src="https://picsum.photos/800/400?random=6" alt="Paisaje"></figure>
        <figure class="item"><img src="https://picsum.photos/400/400?random=7" alt="Square"></figure>
    </section>

</body>

</html>
