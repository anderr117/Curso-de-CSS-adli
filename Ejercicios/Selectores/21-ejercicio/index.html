<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header>
        <h1>
            Aplica estilos solo a formularios dentro de #usuario.
        </h1>
    </header>

    <main>
        <div id="usuario">
            <h2>Información de Usuario</h2>
            <form action="">
                <label for="">Nombre</label>
                <input type="text" placeholder="Edward">
                <br>
                <label for="">Apellido</label>
                <input type="text" placeholder="Hernandez">
                <br>
                <label for="">Edad</label>
                <input type="number" placeholder="58">
            </form>
            <br>
            <h2>Residencia</h2>
            <form action="">
                <label for="">Ciudad</label>
                <input type="text" placeholder="Quetzaltenango">
                <br>
                <label for="">Código Postal</label>
                <input type="number" placeholder="0980">
            </form>
        </div>

        <div class="">
            <h2>Estudios</h2>
            <form action="">
                <label for="">Universidad</label>
                <input type="text" placeholder="Universidad del Valle">
                <br>
                <label for="">Carrera</label>
                <input type="text" placeholder="Cincias Juridicas">
            </form>
        </div>
    </main>
</body>

</html>
